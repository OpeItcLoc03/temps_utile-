; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .

[env:teensy32]
platform = teensy
framework = arduino
board = teensy31
board_f_cpu = 120000000
#upload_port = /dev/tty.usbmodem719691
lib_deps = EEPROM
; src_dir is the project root, so test/ sits under it — keep host unit tests
; out of the firmware build (they need unity.h, only present for `pio test`).
build_src_filter = +<*> -<test/>
; The Teensy core defines _write() as a weak symbol in Print.cpp. PlatformIO
; links the core as a static archive, and a weak definition does not get
; pulled from an archive to satisfy newlib's _write_r reference — so the link
; fails with "undefined reference to `_write'". (Teensyduino's own IDE links
; the core objects directly, which is why upstream never hit this.) Force the
; archive member in with -u. See .tasks/teensy32-write-linkfail.md.
build_flags = -Wl,-u,_write

; --- Teensy 4.0 port (IMXRT1062) — see .wiki/concepts/t4-port-plan.md ---
; Step 1 (GATE): skeleton link only. ch4/OLED/ADC HAL are stubbed under
; __IMXRT1062__; vendored K20 ADC fork (src/ADC/) is excluded from this build
; (ADC_Module.h hard-#errors on non-K20). Steps 2-5 fill the real HAL in.
[env:teensy40]
platform = teensy
framework = arduino
board = teensy40
board_build.f_cpu = 600000000
lib_deps = EEPROM
build_src_filter = +<*> -<src/ADC/> -<test/>

; --- Host unit tests (step 5: storage version-invalidation logic) ---
; Pure-logic tests run on the host; the firmware is NOT compiled here
; (build_src_filter = -<*>). Tests include the header-only storage classes
; directly with a fake STORAGE backend. See test/test_storage/.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++14 -I.
